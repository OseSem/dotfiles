# Mouse wheel scrolling / pane + window selection
set -g mouse on

# Let apps (Claude Code, vim, ...) know when the pane gains/loses focus
set -g focus-events on

# True color + italics passthrough for terminal apps
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc,alacritty:Tc"

# Bigger scrollback buffer
set -g history-limit 50000

# Faster escape handling (avoids ESC key lag in TUIs)
set -sg escape-time 10
